<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>L'Écrin des Senteurs by Manon - Catalogue interactif</title>
  <meta name="description" content="Catalogue interactif Chogan - L'Écrin des Senteurs by Manon">
  <link rel="preload" href="assets/cover.jpg" as="image">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="topbar">
    <button id="menuBtn" class="iconBtn">☰</button>
    <div class="brand">
      <strong>L'Écrin des Senteurs</strong>
      <span>by Manon</span>
    </div>
    <a class="wa small" href="https://wa.me/33601103009?text=Bonjour%20Manon%2C%20je%20viens%20du%20catalogue%20interactif%20et%20je%20souhaite%20un%20renseignement." target="_blank" rel="noopener">WhatsApp</a>
  </header>

  <aside id="drawer" class="drawer">
    <div class="drawerHead">
      <strong>Sommaire</strong>
      <button id="closeDrawer" class="iconBtn">×</button>
    </div>
<button id="homeMenuBtn" class="catItem" onclick="goHome()">
  <strong>Accueil</strong>
  <span>Retour à la couverture et à la table des matières</span>
</button>
   

    <input id="search" class="search" placeholder="Rechercher un produit, une gamme...">

    <div id="catalogueList" class="catalogueList"></div>
    <div id="searchResults" class="searchResults"></div>
  </aside>

  <div id="shade" class="shade"></div>

  <main>
    <section id="home" class="home active">
      <img src="assets/cover.jpg" alt="Couverture L'Écrin des Senteurs by Manon" class="cover">

      <div class="homeActions">
        <button id="startBtn" class="primary">Feuilleter le premier catalogue</button>
        <button id="tocBtn" class="secondary">Ouvrir la recherche / sommaire</button>
        <a class="whatsapp" href="https://wa.me/33601103009?text=Bonjour%20Manon%2C%20je%20viens%20du%20catalogue%20interactif%20et%20je%20souhaite%20commander%20ou%20avoir%20un%20conseil." target="_blank" rel="noopener">Commander / demander conseil sur WhatsApp</a>
      </div>

      <section class="tocHome">
        <h2>Table des matières</h2>
        <p>Choisis directement le catalogue à feuilleter. Le nom du PDF est indiqué sous chaque catalogue.</p>
        <div id="homeToc" class="homeToc"></div>
      </section>
    </section>

    <section id="reader" class="reader">
      <div class="readerToolbar">
        <select id="catalogueSelect"></select>

        <div class="pageControls">
          <button id="prevBtn">‹</button>
          <span id="pageLabel">1 / 1</span>
          <button id="nextBtn">›</button>
        </div>
      </div>

      <p id="readerTitle" class="readerTitle"></p>

      <div id="book" class="book">
        <img id="pageImage" alt="Page du catalogue">
        <div id="loader" class="loader hidden">Chargement...</div>
      </div>

      <div class="bottomBar">
        <button id="zoomBtn">Zoom</button>
        <button id="tocBottomBtn">Sommaire</button>
        <a class="whatsapp" href="https://wa.me/33601103009?text=Bonjour%20Manon%2C%20je%20viens%20du%20catalogue%20interactif%20et%20je%20souhaite%20un%20renseignement." target="_blank" rel="noopener">WhatsApp</a>
      </div>
    </section>
  </main>

  <div id="zoomModal" class="zoomModal">
    <button id="closeZoom" class="closeZoom">×</button>
    <img id="zoomImage" alt="Page zoomée">
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
